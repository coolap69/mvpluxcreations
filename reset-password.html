<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose New Password | MVPLUXCREATIONS</title>
  <link rel="stylesheet" href="style.css?v=20260718-offers-reset" />
</head>
<body>
  <main class="auth-page">
    <a class="auth-home-link" href="index.html">MVPLUXCREATIONS</a>
    <section class="auth-card">
      <h1>Choose a New Password</h1>
      <p>Enter a new password for your account.</p>
      <form class="auth-form" id="updatePasswordForm">
        <label>
          New password
          <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <label>
          Confirm new password
          <input id="confirmNewPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <button type="submit">Save New Password</button>
      </form>
      <p id="passwordResetStatus" class="auth-switch" role="status" aria-live="polite"></p>
      <p class="auth-switch"><a href="signin.html">Back to Sign In</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260718-offers-reset"></script>
  <script src="password-reset.js?v=20260718-offers-reset"></script>
</body>
</html>
