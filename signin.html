<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | MVPLUXCREATIONS</title>
  <link rel="stylesheet" href="style.css?v=20260704-live-admin-settings" />
  <style>
    .auth-form {
      display: grid !important;
      gap: 16px !important;
    }

    .auth-form label {
      display: grid !important;
      gap: 8px !important;
    }

    .auth-form input {
      width: 100% !important;
      height: 56px !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      padding: 14px 16px !important;
      border: 3px solid #f4d06f !important;
      border-radius: 10px !important;
      background: #050505 !important;
      color: #fff !important;
      -webkit-text-fill-color: #fff !important;
      font-size: 18px !important;
      box-sizing: border-box !important;
    }

    .auth-form > button {
      width: 100% !important;
      min-height: 58px !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      border-radius: 10px !important;
      font-size: 18px !important;
      font-weight: 900 !important;
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <a class="auth-home-link" href="index.html">MVPLUXCREATIONS</a>
    <section class="auth-card">
      <h1>Sign In</h1>
      <p>Access your screen name, fan votes, saved ideas, and future order details.</p>

      <form class="auth-form" id="signinForm">
        <label>
          Email
          <input id="signinEmail" type="email" placeholder="you@example.com" />
        </label>
        <label>
          Password
          <span class="password-field">
            <input id="signinPassword" type="password" placeholder="Password" />
            <button class="password-toggle" type="button" aria-label="Show password" onclick="togglePasswordVisibility(this)">👁</button>
          </span>
        </label>
        <button type="submit">Sign In</button>
      </form>

      <p id="signedInNotice" class="auth-switch"></p>
      <p class="auth-switch">Need an account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260704-live-admin-settings"></script>
  <script src="script.js?v=20260704-live-admin-settings"></script>
</body>
</html>
