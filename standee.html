<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standee Details | MVPLUXCREATIONS</title>
  <link rel="stylesheet" href="style.css?v=20260823-custom-order" />
</head>
<body class="standee-detail-body">
  <header class="top-nav">
    <div class="brand"></div>
    <nav>
      <a href="index.html#home">Home</a>
      <a href="index.html#shop">Shop</a>
    </nav>
    <div class="auth-links">
      <a href="signin.html" class="sign-in-link">Sign In</a>
      <a href="signup.html" class="sign-up-link">Sign Up</a>
    </div>
    <button class="cart-button" onclick="toggleCart()" aria-label="Open cart">
      <span class="cart-icon">🛒</span>
      <span id="cartCount" class="cart-count">0</span>
    </button>
  </header>

  <aside id="cartPanel" class="cart-panel">
    <button class="close-cart" onclick="toggleCart()">×</button>
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <p class="cart-total">Total: $<span id="cartTotal">0.00</span></p>
    <button class="checkout-btn" onclick="openCheckout()">Checkout / Pay</button>
  </aside>

  <main id="standeeDetailRoot" class="standee-detail-page"></main>

  <div id="buyModal" class="modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModals()">×</button>
      <h2 id="modalTitle">Standee</h2>
      <img id="modalImage" src="" alt="">
      <p id="modalPrice">$0.00</p>
      <p class="modal-fee-note">Payment instructions are sent after MVPLUXCREATIONS confirms the order details.</p>
      <button class="checkout-btn" onclick="openCheckout()">Continue to Checkout</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260709-card-admin-sync"></script>
  <script src="pricing.js?v=20260823-merchandise-height"></script>
  <script src="product-catalog.js?v=20260716-product-publishing"></script>
  <script src="category-presentation.js?v=20260823-category-sync"></script>
  <script src="script.js?v=20260823-category-action-sync"></script>
</body>
</html>
