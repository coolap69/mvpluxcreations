<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase Test | MVPLUXCREATIONS</title>
  <link rel="stylesheet" href="style.css?v=20260703-carousel-policy" />
  <style>
    .test-list {
      display: grid;
      gap: 14px;
      margin-top: 24px;
      text-align: left;
    }

    .test-row {
      border: 1px solid rgba(244,208,111,0.35);
      border-radius: 10px;
      padding: 14px;
      background: rgba(0,0,0,0.45);
    }

    .test-row strong {
      color: #f4d06f;
      display: block;
      margin-bottom: 6px;
    }

    .test-row pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      color: #f7efd2;
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1>Supabase Test</h1>
      <p>This checks whether the backend connection works before testing signup.</p>
      <button type="button" onclick="runSupabaseTest()">Run Test</button>
      <div id="testResults" class="test-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260703-carousel-policy"></script>
  <script>
    function addResult(title, body) {
      const results = document.getElementById('testResults');
      results.insertAdjacentHTML('beforeend', `
        <div class="test-row">
          <strong>${title}</strong>
          <pre>${String(body || '').replace(/[<>&]/g, (char) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[char]))}</pre>
        </div>
      `);
    }

    async function testFetch(title, url, options = {}) {
      try {
        const response = await fetch(url, options);
        const text = await response.text();
        addResult(title, `Status: ${response.status}\n${text.slice(0, 700) || 'No response body'}`);
      } catch (error) {
        addResult(title, `Network/Load error: ${error.name || 'Error'}: ${error.message || error}`);
      }
    }

    async function runSupabaseTest() {
      const results = document.getElementById('testResults');
      results.innerHTML = '';

      const config = window.MVPLUX_SUPABASE || {};
      addResult('Project URL', config.url || 'Missing URL');
      addResult('Publishable key loaded', config.publishableKey?.startsWith('sb_publishable_') ? 'Yes' : 'No');
      addResult('Supabase library loaded', window.supabase ? 'Yes' : 'No');

      if (config.url && config.publishableKey) {
        await testFetch('Project health direct test', `${config.url}/auth/v1/health`);
        await testFetch('Database API direct test', `${config.url}/rest/v1/categories?select=name,slug&limit=3`, {
          headers: {
            apikey: config.publishableKey,
            Authorization: `Bearer ${config.publishableKey}`
          }
        });
      }

      if (!window.getMvpluxSupabaseClient) {
        addResult('Client', 'Missing getMvpluxSupabaseClient()');
        return;
      }

      const client = window.getMvpluxSupabaseClient();
      addResult('Client created', client ? 'Yes' : 'No');
      if (!client) return;

      try {
        const { data, error } = await client.from('categories').select('name, slug').limit(3);
        addResult('Database categories test', error ? `Error: ${error.message}` : JSON.stringify(data, null, 2));
      } catch (error) {
        addResult('Database categories test', `Network/Load error: ${error.message || error}`);
      }

      try {
        const { data, error } = await client.auth.getSession();
        addResult('Auth session test', error ? `Error: ${error.message}` : `OK. Signed in: ${Boolean(data?.session)}`);
      } catch (error) {
        addResult('Auth session test', `Network/Load error: ${error.message || error}`);
      }
    }
  </script>
</body>
</html>
