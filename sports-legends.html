<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports Star Standees | MVPLUXCREATIONS</title>
  <link rel="stylesheet" href="style.css?v=20260625-admin-preview-price2ft" />
</head>
<body>
  <header class="top-nav">
    <div class="brand"></div>
    <nav>
      <a href="index.html#home">Home</a>
      <a href="index.html#shop">Shop</a>
      <a href="admin.html">Admin</a>
    </nav>
    <div class="auth-links">
      <a href="index.html#shop" class="sign-up-link">Back to Shop</a>
    </div>
  </header>

  <main class="category-page">
    <section class="category-hero">
      <h1>Sports Star Standees</h1>
      <p>Choose a sports standee, then preview available display backgrounds.</p>
    </section>

    <section class="category-panel">
      <h2>Choose a Sports Standee</h2>
      <div class="category-grid">
        <article class="category-card">
          <img src="images/Sports/Kobe/KB1forprint.png" alt="Kobe Bryant standee">
          <h3>Kobe Bryant</h3>
          <button type="button">Select Standee</button>
        </article>
        <article class="category-card">
          <img src="images/Sports/Shaq/shaqNEW.png" alt="Shaq standee">
          <h3>Basketball Center</h3>
          <button type="button">Select Standee</button>
        </article>
        <article class="category-card">
          <img src="images/Sports/Shaq/shaqDarker.png" alt="Alternate sports standee">
          <h3>Alternate Sports Pose</h3>
          <button type="button">Select Standee</button>
        </article>
      </div>
    </section>

    <section class="category-panel">
      <h2>Backing Options</h2>
      <div class="background-carousel">
        <img src="images/Sports/Kobe/KB1toprintbackground.png" alt="Kobe standee with print backing">
        <img src="images/Sports/Kobe/KB1toprintbackgroundcourt.png" alt="Kobe standee with court backing">
        <img src="images/Sports/Kobe/KB1toprintbackgroundcourtsmaller.png" alt="Kobe standee with smaller court backing">
      </div>
    </section>
  </main>
</body>
</html>
