<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | MVPLUXCREATIONS</title>
  <link rel="stylesheet" href="style.css?v=20260718-offers-reset" />
</head>
<body>
  <main class="auth-page">
    <a class="auth-home-link" href="index.html">MVPLUXCREATIONS</a>
    <section class="auth-card">
      <h1>Reset Your Password</h1>
      <p>Enter your account email and we’ll send you a secure password reset link.</p>
      <form class="auth-form" id="forgotPasswordForm">
        <label>
          Email
          <input id="resetEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </label>
        <button type="submit">Send Reset Link</button>
      </form>
      <p id="passwordResetStatus" class="auth-switch" role="status" aria-live="polite"></p>
      <p class="auth-switch"><a href="signin.html">Back to Sign In</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260718-offers-reset"></script>
  <script src="password-reset.js?v=20260718-offers-reset"></script>
</body>
</html>
