<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account | MVPLUXCREATIONS</title>
  <link rel="stylesheet" href="style.css?v=20260718-offer-history" />
</head>
<body>
  <header class="top-nav">
    <div class="brand"></div>
    <nav>
      <a href="index.html#home">Home</a>
      <a href="index.html#shop">Shop</a>
    </nav>
    <div class="auth-links">
      <button type="button" class="admin-inline-signout" id="accountSignOut">Log Out</button>
    </div>
  </header>

  <main class="member-account-page">
    <section class="member-account-hero">
      <h1>My Account</h1>
      <p id="memberAccountStatus" role="status" aria-live="polite">Loading your account...</p>
    </section>

    <div id="memberAccountContent" hidden>
      <section class="member-account-panel" id="my-offers">
        <h2>My Offers</h2>
        <div id="memberOffersList" class="member-offer-list"></div>
      </section>

      <section class="member-account-panel">
        <h2>Orders</h2>
        <div id="memberOrdersList" class="member-offer-list"></div>
      </section>

      <section class="member-account-panel" id="member-discounts">
        <h2>Coupons / Discounts</h2>
        <p>Eligible member discounts appear here. Final eligibility is checked securely when an order is submitted.</p>
        <div id="memberDiscountsList" class="member-offer-list"></div>
      </section>

      <section class="member-account-panel">
        <h2>Account & Password</h2>
        <p id="memberProfileSummary"></p>
        <p><a href="forgot-password.html">Reset password</a></p>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=20260718-offer-history"></script>
  <script src="member-account.js?v=20260718-offer-history"></script>
</body>
</html>
