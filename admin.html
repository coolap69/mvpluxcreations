<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | MVPLUXCREATIONS</title>
  <link rel="stylesheet" href="style.css?v=20260624-admin-panel" />
</head>
<body>
  <header class="top-nav">
    <div class="brand"></div>
    <nav>
      <a href="index.html#home">Home</a>
      <a href="index.html#shop">Shop</a>
      <a href="index.html#custom">Custom Orders</a>
      <a href="index.html#fan-requests">Fan Requests</a>
      <a href="index.html#why-customers">Why Us</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="auth-links">
      <a href="index.html#shop" class="sign-up-link">Back to Site</a>
    </div>
  </header>

  <main class="admin-page">
    <section class="admin-hero">
      <h1>MVPLUX Admin</h1>
      <p>Change product card text, images, original heights, original prices, and coupons without editing code.</p>
    </section>

    <section class="admin-panel">
      <div class="admin-panel-header">
        <h2>Product Cards</h2>
        <button id="resetAdminProducts" type="button">Reset Product Edits</button>
      </div>
      <div id="adminProducts" class="admin-product-list"></div>
    </section>

    <section class="admin-panel">
      <div class="admin-panel-header">
        <h2>Coupon / Discount</h2>
        <button id="clearCoupons" type="button">Clear Coupon</button>
      </div>
      <form id="couponForm" class="admin-coupon-form">
        <label>
          Coupon code
          <input id="couponCode" type="text" placeholder="Example: MVP10" />
        </label>
        <label>
          Discount percent
          <input id="couponDiscount" type="number" min="0" max="100" step="1" placeholder="10" />
        </label>
        <button type="submit">Save Coupon</button>
      </form>
      <p id="adminStatus" class="admin-status"></p>
    </section>
  </main>

  <script src="admin.js?v=20260624-admin-panel"></script>
</body>
</html>
